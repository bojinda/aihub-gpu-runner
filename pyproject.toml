[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aihub-gpu-runner"
version = "0.1.0"
description = "Internal GPU stage supervision and durable admission"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
aihub-gpu-runner = "aihub_gpu_runner.__main__:main"

[tool.setuptools.packages.find]
include = ["aihub_gpu_runner*"]
